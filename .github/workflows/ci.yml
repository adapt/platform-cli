name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install the native Linux musl toolchain
        if: runner.os == 'Linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          target_env=$(printf '%s' "$TARGET" | tr '[:lower:]-' '[:upper:]_')
          echo "CARGO_TARGET_${target_env}_LINKER=musl-gcc" >> "$GITHUB_ENV"
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
      - run: python -m unittest discover -s scripts -p '*_test.py'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - run: python scripts/package_release.py ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: adapt-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: publish-cli-main
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: adapt-*
          path: dist
          merge-multiple: true
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Publish the commit and promote latest
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_RELEASE_BUCKET: ${{ secrets.CLI_RELEASE_BUCKET }}
        run: python3 scripts/publish.py --bucket "$CLI_RELEASE_BUCKET" --commit "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" --directory dist

  publish-production:
    needs: [check, publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    concurrency:
      group: publish-cli-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: adapt-*
          path: dist
          merge-multiple: true
      - uses: google-github-actions/auth@v3
        with:
          project_id: adapt-platform-prod
          workload_identity_provider: projects/57849980830/locations/global/workloadIdentityPools/github/providers/platform-cli
          service_account: platform-cli-publish@adapt-platform-prod.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Publish the tested artifacts to production
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_RELEASE_BUCKET: adapt-platform-prod-cli
        run: python3 scripts/publish.py --bucket "$CLI_RELEASE_BUCKET" --commit "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" --directory dist
