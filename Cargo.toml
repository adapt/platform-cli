[package]
name = "platform-cli"
version = "0.1.0"
edition = "2024"
description = "The user-facing CLI for Adapt Platform"
publish = false

[[bin]]
name = "plat"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.6", features = ["derive", "env"] }
crossterm = "0.29"
futures-util = { version = "0.3", features = ["sink"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time", "signal", "io-util", "io-std", "net"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
url = "2.5"
uuid = { version = "1.27", features = ["v4"] }

[profile.release]
lto = "thin"
strip = true
